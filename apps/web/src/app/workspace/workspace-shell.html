<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/workspace">{{ brand.productName }}</a>

    <nav aria-label="Główna nawigacja">
      <a routerLink="/workspace/dashboard" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.2 12 4l9 7.2v8.3a.5.5 0 0 1-.5.5h-5v-6h-7v6h-5a.5.5 0 0 1-.5-.5z" /></svg>
        <span>Pulpit</span>
      </a>
      <a routerLink="/workspace" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.8h8l4 4V21H6zM14 3v4h4" /></svg>
        <span>Moje CV</span>
      </a>
      <a routerLink="/workspace/templates" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Szablony</span>
      </a>
      <a routerLink="/workspace/profile" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2z" /></svg>
        <span>Profil</span>
      </a>
      <a routerLink="/workspace/settings" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.6-1.5.9-1.9-2.1-2.1-1.9.9-1.5-.6L11 2H8l-.7 2.6-1.5.6-1.9-.9-2.1 2.1.9 1.9-.6 1.5-2 .7v3l2 .7.6 1.5-.9 1.9 2.1 2.1 1.9-.9 1.5.6L8 22h3l.7-2.6 1.5-.6 1.9.9 2.1-2.1-.9-1.9.6-1.5z" /></svg>
        <span>Ustawienia</span>
      </a>
    </nav>

    <div class="account">
      <span class="avatar">{{ initials() }}</span>
      <span class="account-name">{{ user()?.displayName || user()?.email || 'Ładowanie…' }}</span>
      <app-theme-toggle />
      <button type="button" class="logout" (click)="logout()" aria-label="Wyloguj się" title="Wyloguj się">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10" /></svg>
      </button>
    </div>
  </aside>

  <main class="workspace-content">
    <router-outlet />
  </main>
</div>
