name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  API_IMAGE: ghcr.io/${{ github.repository }}-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web
  IMAGE_TAG: ${{ github.sha }}

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.MIKRUS_SSH_KEY }}
          SSH_HOST: ${{ secrets.MIKRUS_HOST }}
          SSH_PORT: ${{ secrets.MIKRUS_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/mikrus
          chmod 600 ~/.ssh/mikrus
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          SSH_HOST: ${{ secrets.MIKRUS_HOST }}
          SSH_PORT: ${{ secrets.MIKRUS_PORT }}
          SSH_USER: ${{ secrets.MIKRUS_USER }}
        run: |
          scp -i ~/.ssh/mikrus -P "$SSH_PORT" \
            compose.production.yml \
            deploy/backup-database.sh \
            deploy/deploy-production.sh \
            "$SSH_USER@$SSH_HOST:/opt/arcfolio/"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.MIKRUS_HOST }}
          SSH_PORT: ${{ secrets.MIKRUS_PORT }}
          SSH_USER: ${{ secrets.MIKRUS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/mikrus -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/mikrus -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd /opt/arcfolio && chmod 700 backup-database.sh deploy-production.sh && printf 'API_IMAGE=%s\nWEB_IMAGE=%s\nIMAGE_TAG=%s\n' '$API_IMAGE' '$WEB_IMAGE' '$IMAGE_TAG' > .env && ./deploy-production.sh"
