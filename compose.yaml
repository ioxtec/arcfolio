services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cv_app
      POSTGRES_USER: cv_app
      POSTGRES_PASSWORD: dev_only_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv_app -d cv_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
